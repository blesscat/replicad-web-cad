<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Desk System 快速入門</title>
  <desc id="desc">Desk System 組裝流程：從 Board 與 Snap 開始，選擇一種定位方式，再放入 Grid Box 或 Round Box。內建角座與獨立 Locating Post 二選一。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="70" y="68" fill="#0f172a" font-family="Noto Sans TC, Inter, sans-serif" font-size="38" font-weight="750">Desk System 快速入門</text>
  <text x="70" y="108" fill="#475569" font-family="Noto Sans TC, Inter, sans-serif" font-size="20">Board → Snap → 選擇一種定位方式 → Grid Box／Round Box</text>

  <g filter="url(#shadow)">
    <rect x="70" y="178" width="250" height="190" rx="22" fill="#eaf2ff" stroke="#2563eb" stroke-width="3"/>
    <rect x="390" y="178" width="250" height="190" rx="22" fill="#e7fbf7" stroke="#0d9488" stroke-width="3"/>
    <rect x="665" y="300" width="270" height="175" rx="22" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
    <rect x="965" y="300" width="270" height="175" rx="22" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
    <rect x="1000" y="540" width="350" height="190" rx="22" fill="#f3eefe" stroke="#7c3aed" stroke-width="3"/>
  </g>

  <circle cx="108" cy="216" r="22" fill="#2563eb"/>
  <text x="108" y="224" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="21" font-weight="700">1</text>
  <text x="145" y="224" fill="#1e3a8a" font-family="Noto Sans TC, Inter, sans-serif" font-size="27" font-weight="700">Board（底版）</text>
  <text x="105" y="275" fill="#1e293b" font-family="Noto Sans TC, Inter, sans-serif" font-size="19">列印並放在桌面上</text>
  <text x="105" y="308" fill="#475569" font-family="Noto Sans TC, Inter, sans-serif" font-size="17">直接放置即可</text>
  <text x="105" y="337" fill="#475569" font-family="Noto Sans TC, Inter, sans-serif" font-size="17">螺絲孔固定：非必要</text>

  <circle cx="428" cy="216" r="22" fill="#0d9488"/>
  <text x="428" y="224" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="21" font-weight="700">2</text>
  <text x="465" y="224" fill="#115e59" font-family="Noto Sans TC, Inter, sans-serif" font-size="27" font-weight="700">Snap（咔咔）</text>
  <text x="425" y="275" fill="#1e293b" font-family="Noto Sans TC, Inter, sans-serif" font-size="19">每個盒子位置一個</text>
  <text x="425" y="308" fill="#475569" font-family="Noto Sans TC, Inter, sans-serif" font-size="17">準備對應的 Snap</text>
  <text x="425" y="337" fill="#475569" font-family="Noto Sans TC, Inter, sans-serif" font-size="17">再放入容器</text>

  <path d="M 320 273 H 380" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="710" y="155" width="300" height="60" rx="30" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="746" cy="185" r="22" fill="#f59e0b"/>
  <text x="746" y="193" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="21" font-weight="700">3</text>
  <text x="780" y="193" fill="#92400e" font-family="Noto Sans TC, Inter, sans-serif" font-size="20" font-weight="700">選擇一種定位方式</text>
  <path d="M 640 273 H 700" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 860 215 V 275 M 860 275 H 750 M 860 275 H 970" fill="none" stroke="#f59e0b" stroke-width="4"/>
  <circle cx="860" cy="275" r="7" fill="#f59e0b"/>

  <text x="700" y="340" fill="#92400e" font-family="Noto Sans TC, Inter, sans-serif" font-size="20" font-weight="700">獨立 Locating Post</text>
  <text x="700" y="367" fill="#92400e" font-family="Noto Sans TC, Inter, sans-serif" font-size="17" font-weight="650">（獨立零件）</text>
  <text x="700" y="402" fill="#1e293b" font-family="Noto Sans TC, Inter, sans-serif" font-size="17">使用一般角座孔</text>
  <text x="700" y="430" fill="#475569" font-family="Noto Sans TC, Inter, sans-serif" font-size="17">列印並安裝定位柱</text>
  <text x="700" y="458" fill="#92400e" font-family="Noto Sans TC, Inter, sans-serif" font-size="15" font-weight="650">定位柱：額外 1 個零件</text>

  <text x="1000" y="342" fill="#92400e" font-family="Noto Sans TC, Inter, sans-serif" font-size="20" font-weight="700">內建角座</text>
  <text x="1000" y="382" fill="#1e293b" font-family="Noto Sans TC, Inter, sans-serif" font-size="17">選擇盒子的內建角座</text>
  <text x="1000" y="413" fill="#475569" font-family="Noto Sans TC, Inter, sans-serif" font-size="17">不需要額外 Locating Post</text>
  <text x="1000" y="447" fill="#92400e" font-family="Noto Sans TC, Inter, sans-serif" font-size="16" font-weight="650">定位座：盒子的一部分</text>

  <path d="M 800 475 V 505 H 1180 V 530" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 1100 475 V 505" fill="none" stroke="#64748b" stroke-width="4"/>
  <circle cx="1040" cy="578" r="22" fill="#7c3aed"/>
  <text x="1040" y="586" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="21" font-weight="700">4</text>
  <text x="1080" y="586" fill="#5b21b6" font-family="Noto Sans TC, Inter, sans-serif" font-size="20" font-weight="700">Grid Box／Round Box</text>
  <text x="1035" y="635" fill="#1e293b" font-family="Noto Sans TC, Inter, sans-serif" font-size="16">列印後放入已定位的格位</text>
  <text x="1035" y="670" fill="#475569" font-family="Noto Sans TC, Inter, sans-serif" font-size="16">第一個範例使用 Grid Box</text>
  <text x="1035" y="700" fill="#475569" font-family="Noto Sans TC, Inter, sans-serif" font-size="16">Round Box 使用相同流程</text>

  <rect x="70" y="650" width="865" height="80" rx="18" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="103" y="688" fill="#3730a3" font-family="Noto Sans TC, Inter, sans-serif" font-size="18" font-weight="700">第一版 Quick Start 範圍</text>
  <text x="103" y="716" fill="#475569" font-family="Noto Sans TC, Inter, sans-serif" font-size="17">先說明系統流程；切片與列印設定留待後續。</text>
</svg>
