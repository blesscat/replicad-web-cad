<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Desk locating options</title>
  <desc id="desc">Two mutually exclusive locating methods: a separate Locating Post or a box with a built-in seat. The built-in seat does not use an extra Locating Post.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1100" height="560" fill="#f8fafc"/>
  <text x="55" y="58" fill="#0f172a" font-family="Inter, sans-serif" font-size="32" font-weight="750">Choose one locating method</text>
  <text x="55" y="92" fill="#475569" font-family="Inter, sans-serif" font-size="18">Both options locate the same box position; do not combine them.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="140" width="465" height="300" rx="24" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
    <rect x="580" y="140" width="465" height="300" rx="24" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
  </g>

  <text x="90" y="185" fill="#92400e" font-family="Inter, sans-serif" font-size="24" font-weight="700">A. Locating Post (separate)</text>
  <rect x="130" y="255" width="150" height="115" rx="14" fill="#f3eefe" stroke="#7c3aed" stroke-width="3"/>
  <circle cx="205" cy="255" r="24" fill="#f59e0b" stroke="white" stroke-width="5"/>
  <rect x="185" y="385" width="40" height="35" rx="6" fill="#f59e0b"/>
  <path d="M 205 280 V 385" stroke="#92400e" stroke-width="6"/>
  <text x="320" y="270" fill="#1e293b" font-family="Inter, sans-serif" font-size="17">Uses regular seat holes</text>
  <text x="320" y="302" fill="#475569" font-family="Inter, sans-serif" font-size="17">Print and install one</text>
  <text x="320" y="330" fill="#475569" font-family="Inter, sans-serif" font-size="17">separate Locating Post</text>
  <text x="320" y="380" fill="#92400e" font-family="Inter, sans-serif" font-size="16" font-weight="700">Extra part required</text>

  <text x="615" y="185" fill="#92400e" font-family="Inter, sans-serif" font-size="24" font-weight="700">B. Built-in seat</text>
  <rect x="670" y="255" width="150" height="115" rx="14" fill="#f3eefe" stroke="#7c3aed" stroke-width="3"/>
  <path d="M 745 370 V 415" stroke="#f59e0b" stroke-width="14" stroke-linecap="round"/>
  <circle cx="745" cy="255" r="24" fill="#f59e0b" stroke="white" stroke-width="5"/>
  <text x="860" y="270" fill="#1e293b" font-family="Inter, sans-serif" font-size="17">Pick the box's</text>
  <text x="860" y="302" fill="#475569" font-family="Inter, sans-serif" font-size="17">built-in seat option</text>
  <text x="860" y="330" fill="#475569" font-family="Inter, sans-serif" font-size="17">The seat is built in</text>
  <text x="860" y="380" fill="#92400e" font-family="Inter, sans-serif" font-size="16" font-weight="700">No extra Post needed</text>

  <rect x="245" y="475" width="610" height="50" rx="25" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="550" y="507" text-anchor="middle" fill="#3730a3" font-family="Inter, sans-serif" font-size="18" font-weight="700">Choose A or B — never both for the same position</text>
</svg>
