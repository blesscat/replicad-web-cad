<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Board and Snap placement</title>
  <desc id="desc">Top view of a Desk System Board with a Snap placed at every box position.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1000" height="560" fill="#f8fafc"/>
  <text x="55" y="58" fill="#0f172a" font-family="Inter, sans-serif" font-size="32" font-weight="750">Board + Snap placement</text>
  <text x="55" y="92" fill="#475569" font-family="Inter, sans-serif" font-size="18">Place a matching Snap at each grid position that will hold a box.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="145" width="570" height="330" rx="24" fill="#eaf2ff" stroke="#2563eb" stroke-width="4"/>
  </g>
  <text x="105" y="190" fill="#1e3a8a" font-family="Inter, sans-serif" font-size="24" font-weight="700">Board</text>
  <text x="105" y="220" fill="#475569" font-family="Inter, sans-serif" font-size="16">Desk grid / top view</text>
  <g stroke="#93c5fd" stroke-width="2" opacity="0.85">
    <path d="M 120 260 H 590 M 120 330 H 590 M 120 400 H 590"/>
    <path d="M 200 235 V 430 M 280 235 V 430 M 360 235 V 430 M 440 235 V 430 M 520 235 V 430"/>
  </g>
  <g fill="#0d9488" stroke="white" stroke-width="5">
    <circle cx="160" cy="295" r="22"/>
    <circle cx="320" cy="295" r="22"/>
    <circle cx="480" cy="295" r="22"/>
    <circle cx="240" cy="365" r="22"/>
    <circle cx="400" cy="365" r="22"/>
    <circle cx="560" cy="365" r="22"/>
  </g>
  <g fill="white" font-family="Inter, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <text x="160" y="301">S</text><text x="320" y="301">S</text><text x="480" y="301">S</text>
    <text x="240" y="371">S</text><text x="400" y="371">S</text><text x="560" y="371">S</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="700" y="165" width="230" height="120" rx="20" fill="#e7fbf7" stroke="#0d9488" stroke-width="3"/>
  </g>
  <circle cx="735" cy="205" r="21" fill="#0d9488"/>
  <text x="735" y="212" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="16" font-weight="700">S</text>
  <text x="770" y="212" fill="#115e59" font-family="Inter, sans-serif" font-size="22" font-weight="700">Snap</text>
  <text x="730" y="250" fill="#475569" font-family="Inter, sans-serif" font-size="16">One per box position</text>

  <g filter="url(#shadow)">
    <rect x="700" y="330" width="230" height="120" rx="20" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
  </g>
  <text x="730" y="370" fill="#92400e" font-family="Inter, sans-serif" font-size="21" font-weight="700">Next</text>
  <text x="730" y="403" fill="#1e293b" font-family="Inter, sans-serif" font-size="16">Add one locating method</text>
  <text x="730" y="428" fill="#475569" font-family="Inter, sans-serif" font-size="16">before the container</text>
</svg>
