<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Desk System Quick Start</title>
  <desc id="desc">Desk System assembly flow from Board and Snap to one locating method, then Grid Box or Round Box. Built-in seat and separate Locating Post are mutually exclusive.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="70" y="68" fill="#0f172a" font-family="Inter, sans-serif" font-size="38" font-weight="750">Desk System Quick Start</text>
  <text x="70" y="108" fill="#475569" font-family="Inter, sans-serif" font-size="20">Board → Snap → choose one locating method → Grid Box / Round Box</text>

  <g filter="url(#shadow)">
    <rect x="70" y="178" width="250" height="190" rx="22" fill="#eaf2ff" stroke="#2563eb" stroke-width="3"/>
    <rect x="390" y="178" width="250" height="190" rx="22" fill="#e7fbf7" stroke="#0d9488" stroke-width="3"/>
    <rect x="665" y="300" width="270" height="175" rx="22" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
    <rect x="965" y="300" width="270" height="175" rx="22" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
    <rect x="1000" y="540" width="350" height="190" rx="22" fill="#f3eefe" stroke="#7c3aed" stroke-width="3"/>
  </g>

  <circle cx="108" cy="216" r="22" fill="#2563eb"/>
  <text x="108" y="224" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="21" font-weight="700">1</text>
  <text x="145" y="224" fill="#1e3a8a" font-family="Inter, sans-serif" font-size="28" font-weight="700">Board</text>
  <text x="105" y="275" fill="#1e293b" font-family="Inter, sans-serif" font-size="19">Print and place it</text>
  <text x="105" y="308" fill="#475569" font-family="Inter, sans-serif" font-size="17">Just place it down</text>
  <text x="105" y="337" fill="#475569" font-family="Inter, sans-serif" font-size="17">Screw holes optional</text>

  <circle cx="428" cy="216" r="22" fill="#0d9488"/>
  <text x="428" y="224" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="21" font-weight="700">2</text>
  <text x="465" y="224" fill="#115e59" font-family="Inter, sans-serif" font-size="28" font-weight="700">Snap</text>
  <text x="425" y="275" fill="#1e293b" font-family="Inter, sans-serif" font-size="19">For every box position</text>
  <text x="425" y="308" fill="#475569" font-family="Inter, sans-serif" font-size="17">Get the matching Snap</text>
  <text x="425" y="337" fill="#475569" font-family="Inter, sans-serif" font-size="17">before adding a box</text>

  <path d="M 320 273 H 380" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="710" y="155" width="300" height="60" rx="30" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="746" cy="185" r="22" fill="#f59e0b"/>
  <text x="746" y="193" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="21" font-weight="700">3</text>
  <text x="780" y="193" fill="#92400e" font-family="Inter, sans-serif" font-size="20" font-weight="700">Choose one locator</text>
  <path d="M 640 273 H 700" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 860 215 V 275 M 860 275 H 750 M 860 275 H 970" fill="none" stroke="#f59e0b" stroke-width="4"/>
  <circle cx="860" cy="275" r="7" fill="#f59e0b"/>

  <text x="700" y="340" fill="#92400e" font-family="Inter, sans-serif" font-size="20" font-weight="700">Locating Post</text>
  <text x="700" y="367" fill="#92400e" font-family="Inter, sans-serif" font-size="17" font-weight="650">(separate)</text>
  <text x="700" y="402" fill="#1e293b" font-family="Inter, sans-serif" font-size="17">Use a standard seat hole</text>
  <text x="700" y="430" fill="#475569" font-family="Inter, sans-serif" font-size="17">Print and install the Post</text>
  <text x="700" y="458" fill="#92400e" font-family="Inter, sans-serif" font-size="15" font-weight="650">Locator: 1 separate part</text>

  <text x="1000" y="342" fill="#92400e" font-family="Inter, sans-serif" font-size="20" font-weight="700">Built-in seat</text>
  <text x="1000" y="382" fill="#1e293b" font-family="Inter, sans-serif" font-size="17">Choose the built-in seat</text>
  <text x="1000" y="413" fill="#475569" font-family="Inter, sans-serif" font-size="17">No extra Locating Post</text>
  <text x="1000" y="447" fill="#92400e" font-family="Inter, sans-serif" font-size="16" font-weight="650">Locator: part of the box</text>

  <path d="M 800 475 V 505 H 1180 V 530" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 1100 475 V 505" fill="none" stroke="#64748b" stroke-width="4"/>
  <circle cx="1040" cy="578" r="22" fill="#7c3aed"/>
  <text x="1040" y="586" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="21" font-weight="700">4</text>
  <text x="1080" y="586" fill="#5b21b6" font-family="Inter, sans-serif" font-size="20" font-weight="700">Grid Box / Round Box</text>
  <text x="1035" y="635" fill="#1e293b" font-family="Inter, sans-serif" font-size="16">Print, then place in the located grid</text>
  <text x="1035" y="670" fill="#475569" font-family="Inter, sans-serif" font-size="16">Grid Box is the first example</text>
  <text x="1035" y="700" fill="#475569" font-family="Inter, sans-serif" font-size="16">Round Box follows the same flow</text>

  <rect x="70" y="650" width="865" height="80" rx="18" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="103" y="688" fill="#3730a3" font-family="Inter, sans-serif" font-size="18" font-weight="700">Version 1 Quick Start scope</text>
  <text x="103" y="716" fill="#475569" font-family="Inter, sans-serif" font-size="17">Explain the system workflow first; slicer and print settings come later.</text>
</svg>
